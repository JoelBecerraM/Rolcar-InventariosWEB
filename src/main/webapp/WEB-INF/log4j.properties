log4j.rootLogger=ERROR, CONSOLE, erp

log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.ConversionPattern=%d [%t] %-5p %c - %m%n

log4j.appender.erp=org.apache.log4j.RollingFileAppender
log4j.appender.erp.File=${ecommerce.home}/logs/inventarios.log
log4j.appender.erp.MaxFileSize=3000KB
log4j.appender.erp.MaxBackupIndex=8
log4j.appender.erp.layout=org.apache.log4j.PatternLayout
log4j.appender.erp.layout.ConversionPattern=%d [%t] %-5p %c - %m%n
log4j.appender.erp.append=true

log4j.logger.com.atcloud=DEBUG
log4j.logger.mx.com.rolcar=DEBUG
